# Reproducible Docker configuration; live service was created directly through Render MCP.
# Retain Free and provision Neon separately. No Render database, disk, or worker.
services:
  - type: web
    name: agentshield-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_RUNS_ENABLED
        value: "false"
      - key: PUBLIC_LLM_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: demo
      - key: LOG_LEVEL
        value: INFO
